<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter | Oasis Infobyte Task</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }
    h2 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
    .input-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: #94a3b8; }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1.1rem;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    .btn-reset {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-reset:hover { background: #0284c7; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Temperature Converter</h2>
    <div class="input-group">
      <label for="celsius">Celsius (°C)</label>
      <input type="number" id="celsius" placeholder="Enter Celsius" step="any">
    </div>
    <div class="input-group">
      <label for="fahrenheit">Fahrenheit (°F)</label>
      <input type="number" id="fahrenheit" placeholder="Enter Fahrenheit" step="any">
    </div>
    <div class="input-group">
      <label for="kelvin">Kelvin (K)</label>
      <input type="number" id="kelvin" placeholder="Enter Kelvin" step="any">
    </div>
    <button class="btn-reset" id="reset-btn">Reset All</button>
  </div>

  <script>
    const cInput = document.getElementById('celsius');
    const fInput = document.getElementById('fahrenheit');
    const kInput = document.getElementById('kelvin');

    function round(num) {
      return Math.round(num * 100) / 100;
    }

    cInput.addEventListener('input', () => {
      const c = parseFloat(cInput.value);
      if (isNaN(c)) { fInput.value = ''; kInput.value = ''; return; }
      fInput.value = round((c * 9/5) + 32);
      kInput.value = round(c + 273.15);
    });

    fInput.addEventListener('input', () => {
      const f = parseFloat(fInput.value);
      if (isNaN(f)) { cInput.value = ''; kInput.value = ''; return; }
      const c = (f - 32) * 5/9;
      cInput.value = round(c);
      kInput.value = round(c + 273.15);
    });

    kInput.addEventListener('input', () => {
      const k = parseFloat(kInput.value);
      if (isNaN(k)) { cInput.value = ''; fInput.value = ''; return; }
      const c = k - 273.15;
      cInput.value = round(c);
      fInput.value = round((c * 9/5) + 32);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      cInput.value = '';
      fInput.value = '';
      kInput.value = '';
    });
  </script>
</body>
</html>
